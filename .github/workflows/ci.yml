name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes the older run's answer worthless, so stop paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here publishes anything. Read-only is the entire requirement.
permissions:
  contents: read

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` and not `npm install`: it fails when package.json and the
      # lockfile disagree, which is one of the few classes of breakage a local
      # run will happily paper over and a Vercel build will not.
      - run: npm ci

      # `next build` typechecks too, but only what the route graph reaches and
      # only after a full compile. tsc fails in seconds and covers files that
      # nothing imports yet.
      - name: Typecheck
        run: npx tsc --noEmit

      # Lint is here because it was not, and eleven problems accumulated
      # unnoticed as a result — among them two refs touched during render
      # (unsound: render can run twice per commit and can be discarded) and two
      # useMemos whose deps changed every render, so they never memoised
      # anything. tsc and next build pass all four. Nothing else in this
      # pipeline would ever have said so.
      - name: Lint
        run: npx eslint .

      # No Supabase env in CI, on purpose. Demo mode is a supported way to run
      # this app, so the build has to survive createClient() returning null —
      # and a green build here proves it still does.
      - name: Build
        run: npm run build
