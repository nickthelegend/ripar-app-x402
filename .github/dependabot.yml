version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # A major TypeScript bump rewrites what compiles. Dependabot opened
      # typescript@7 against every repo and every one of those PRs went red —
      # that is the upgrade being a real project, not CI being broken. Majors
      # here are taken deliberately, not merged from a bot.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint 10 removed context.getFilename(). eslint-plugin-react still
      # calls it, so the bump does not surface lint findings — it crashes the
      # run outright. The latest published eslint-plugin-react, -jsx-a11y and
      # -import all still cap their peer at eslint 9, so there is nothing to
      # bump alongside it and no override that helps. Blocked upstream, not
      # declined: drop this entry once those plugins support 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Next and React majors move together with the whole app; same reasoning.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
